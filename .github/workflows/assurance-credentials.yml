name: Assurance credential lifecycle

on:
  push:
    paths:
      - ".github/workflows/assurance-credentials.yml"
      - "tools/assurance-credentials/**"
      - "docs/research/credentials-phase-8/**"
  pull_request:
    paths:
      - ".github/workflows/assurance-credentials.yml"
      - "tools/assurance-credentials/**"
      - "docs/research/credentials-phase-8/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate authenticated credential lifecycle
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          python -m pip check
          python -m unittest discover -s tools/assurance-credentials/tests -v
          python tools/assurance-credentials/evidence.py verify docs/research/credentials-phase-8/evidence.zip --expected-root "$(cat docs/research/credentials-phase-8/ROOT.sha256)"
