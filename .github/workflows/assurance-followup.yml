name: Assurance follow-up experiments

on:
  push:
    paths:
      - ".github/workflows/assurance-followup.yml"
      - "tools/assurance-recovery/**"
      - "docs/research/recovery-phase-5/**"
      - "tools/assurance-reproduce/**"
      - "docs/research/reproduction-phase-4/**"
  pull_request:
    paths:
      - ".github/workflows/assurance-followup.yml"
      - "tools/assurance-recovery/**"
      - "docs/research/recovery-phase-5/**"
      - "tools/assurance-reproduce/**"
      - "docs/research/reproduction-phase-4/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Reproduce all saved proposals with retained receiver evidence
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          python -m pip check
          python tools/assurance-reproduce/reproduce.py preflight
          python -m unittest discover -s tools/assurance-reproduce/tests -v
          python tools/assurance-reproduce/reproduce.py run --out /tmp/simurgh-fresh-replay > /tmp/simurgh-fresh-replay.stdout 2> /tmp/simurgh-fresh-replay.stderr
          python - <<'PYTHON'
          import json, pathlib, subprocess, sys
          output = pathlib.Path('/tmp/simurgh-fresh-replay')
          root = json.loads((output / 'receipt.json').read_text())['manifest_sha256']
          subprocess.run([sys.executable, 'tools/assurance-reproduce/reproduce.py', 'verify', str(output / 'evidence.zip'), '--expected-root', root], check=True)
          print('Fresh-host generated root:', root)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fresh-host-phase4-evidence
          path: |
            /tmp/simurgh-fresh-replay/
            /tmp/simurgh-fresh-replay.stdout
            /tmp/simurgh-fresh-replay.stderr
          if-no-files-found: error
          retention-days: 14

  recovery-and-response:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate guarded recovery and incident response
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          python -m pip check
          python -m unittest discover -s tools/assurance-recovery/tests -v
          python tools/assurance-recovery/evidence.py verify docs/research/recovery-phase-5/evidence.zip --expected-root "$(cat docs/research/recovery-phase-5/ROOT.sha256)"
