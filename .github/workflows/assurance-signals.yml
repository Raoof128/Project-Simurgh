name: Assurance safety signals

on:
  push:
    paths:
      - ".github/workflows/assurance-signals.yml"
      - "tools/assurance-signals/**"
      - "docs/research/signals-phase-6/**"
  pull_request:
    paths:
      - ".github/workflows/assurance-signals.yml"
      - "tools/assurance-signals/**"
      - "docs/research/signals-phase-6/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate signed safety signals and monitor dispatch
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          python -m pip check
          python -m unittest discover -s tools/assurance-signals/tests -v
          python tools/assurance-signals/evidence.py verify docs/research/signals-phase-6/evidence.zip --expected-root "$(cat docs/research/signals-phase-6/ROOT.sha256)"
