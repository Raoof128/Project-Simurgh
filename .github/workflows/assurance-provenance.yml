name: Assurance provenance (Phase 19)

# Phase 19 lanes over the unpinned successor and the forked receiver, plus the Linux x86_64
# replay chain the 19a receipt could not run on the authoring host. Paths are scoped to the
# namespace and its evidence (P19-CI01); the Stage 5Q census pins every step of this file.

on:
  push:
    paths:
      - ".github/workflows/assurance-provenance.yml"
      - "tools/assurance-provenance/**"
      - "tools/assurance-composed-successor/**"
      - "proofs/phase19/**"
      - "docs/research/provenance-phase-19a/**"
      - "docs/research/provenance-phase-19b/**"
      - "docs/research/provenance-phase-19c/**"
  pull_request:
    paths:
      - ".github/workflows/assurance-provenance.yml"
      - "tools/assurance-provenance/**"
      - "tools/assurance-composed-successor/**"
      - "proofs/phase19/**"
      - "docs/research/provenance-phase-19a/**"
      - "docs/research/provenance-phase-19b/**"
      - "docs/research/provenance-phase-19c/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install elan (pinned toolchain from proofs/phase19/lean-toolchain)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/elan.tar.gz"
          ./elan-init -y --default-toolchain "$(cat proofs/phase19/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the hash-locked replay dependencies and preflight the host
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          python -m pip check
          python -B tools/replay-preflight/preflight.py
      - name: Validate Phase 19 lanes (projection, write-anywhere, approval, outage, receiver, Lean differential)
        run: python -m unittest discover -s tools/assurance-provenance/tests -v
      - name: Verify the Phase 19a pack and chain the frozen Phase 17 replay through it
        run: |
          python -B tools/assurance-provenance/evidence.py verify docs/research/provenance-phase-19a/evidence.zip --expected-root "$(cat docs/research/provenance-phase-19a/ROOT.sha256)" --replay > receipt-19a.json
          python -c "import json; r = json.load(open('receipt-19a.json')); assert r['replay']['result'] == 'verified', r; print('19a verified with the frozen replay chained')"
      - name: Verify the Phase 19b and 19c packs
        run: |
          python -B tools/assurance-provenance/evidence19b.py verify docs/research/provenance-phase-19b/evidence.zip --expected-root "$(cat docs/research/provenance-phase-19b/ROOT.sha256)" > receipt-19b.json
          python -c "import json; r = json.load(open('receipt-19b.json')); assert r['phase_19b_closed'] is True, r; print('19b verified, closed')"
          python -B tools/assurance-provenance/evidence19c.py verify docs/research/provenance-phase-19c/evidence.zip --expected-root "$(cat docs/research/provenance-phase-19c/ROOT.sha256)" > receipt-19c.json
          python -c "import json; r = json.load(open('receipt-19c.json')); assert r['new_reasons'] == 8, r; print('19c verified')"
