name: Assurance composed lifecycle

on:
  push:
    paths:
      - ".github/workflows/assurance-composed.yml"
      - "tools/assurance-composed/**"
      - "tools/assurance-composed-successor/**"
      - "tools/assurance-signals/**"
      - "tools/assurance-credentials/**"
      - "tools/assurance-context/**"
      - "tools/assurance-connector/**"
      - "docs/research/composition-phase-9/**"
  pull_request:
    paths:
      - ".github/workflows/assurance-composed.yml"
      - "tools/assurance-composed/**"
      - "tools/assurance-composed-successor/**"
      - "tools/assurance-signals/**"
      - "tools/assurance-credentials/**"
      - "tools/assurance-context/**"
      - "tools/assurance-connector/**"
      - "docs/research/composition-phase-9/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composed-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate composed lifecycle controls
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          python -m pip check
          python -m unittest discover -s tools/assurance-composed/tests -v
          python tools/assurance-composed/evidence.py verify docs/research/composition-phase-9/evidence.zip --expected-root "$(cat docs/research/composition-phase-9/ROOT.sha256)"
      - name: Validate post-freeze successor pipeline
        run: python -m unittest discover -s tools/assurance-composed-successor/tests -v
