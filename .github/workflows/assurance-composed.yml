name: Assurance composed lifecycle

on:
  push:
    paths:
      - ".github/workflows/assurance-composed.yml"
      - "tools/assurance-composed/**"
      - "docs/research/composition-phase-9/**"
  pull_request:
    paths:
      - ".github/workflows/assurance-composed.yml"
      - "tools/assurance-composed/**"
      - "docs/research/composition-phase-9/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composed-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate composed lifecycle controls
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          python -m pip check
          python -m unittest discover -s tools/assurance-composed/tests -v
          python tools/assurance-composed/evidence.py verify docs/research/composition-phase-9/evidence.zip --expected-root "$(cat docs/research/composition-phase-9/ROOT.sha256)"
