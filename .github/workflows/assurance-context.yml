name: Assurance context and delegation

on:
  push:
    paths:
      - ".github/workflows/assurance-context.yml"
      # Imported through sys.path by this lane (pass-3 M13): a change there must run it.
      - "tools/assurance-connector/**"
      - "tools/assurance-reproduce/**"
      - "tools/assurance-context/**"
      - "docs/research/context-phase-7/**"
  pull_request:
    paths:
      - ".github/workflows/assurance-context.yml"
      - "tools/assurance-connector/**"
      - "tools/assurance-reproduce/**"
      - "tools/assurance-context/**"
      - "docs/research/context-phase-7/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-delegation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate durable context and delegated authority
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          python -m pip check
          python -m unittest discover -s tools/assurance-context/tests -v
          python tools/assurance-context/evidence.py verify docs/research/context-phase-7/evidence.zip --expected-root "$(cat docs/research/context-phase-7/ROOT.sha256)"
