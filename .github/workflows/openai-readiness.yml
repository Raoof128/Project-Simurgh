name: OpenAI readiness instrument

on:
  push:
    paths:
      - "tools/assurance-lab/**"
      - "tests/unit/assuranceLab/**"
      - "docs/assurance/**"
      - "tools/openai-readiness/**"
      - "tests/unit/openaiReadiness/**"
      - "docs/openai/**"
      - "src/llmShield/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/openai-readiness.yml"
  pull_request:
    paths:
      - "tools/assurance-lab/**"
      - "tests/unit/assuranceLab/**"
      - "docs/assurance/**"
      - "tools/openai-readiness/**"
      - "tests/unit/openaiReadiness/**"
      - "docs/openai/**"
      - "src/llmShield/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/openai-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:openai
      - run: npm run openai:offline -- --out /tmp/simurgh-openai/report.json
      - run: npm run openai:verify -- /tmp/simurgh-openai/report.json
      - name: Verify the saved reviewer artifact against this source tree
        run: npm run openai:verify -- docs/openai/results/offline-report.json
      - name: Run the real-effects assurance experiment
        run: |
          npm run test:assurance
          npm run assurance:run -- --out /tmp/simurgh-assurance/report.json
          npm run assurance:verify -- /tmp/simurgh-assurance/report.json
          npm run assurance:verify -- docs/assurance/evidence/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-evaluation-reports
          path: |
            /tmp/simurgh-openai/report.json
            /tmp/simurgh-assurance/report.json
          if-no-files-found: error
