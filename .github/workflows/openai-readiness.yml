name: OpenAI readiness instrument

on:
  push:
    paths:
      - "tools/hf-containment/**"
      - "tools/hf-incident-sim/**"
      - "tools/safety-study/**"
      - "tools/openai-native/**"
      - "tools/openai-comparison/**"
      - "tools/local-meta-study/**"
      - "tools/local-meta-pilot/**"
      - "tools/assurance-isolation/**"
      - "tools/assurance-egress/**"
      - "tools/assurance-scope/**"
      - "tools/assurance-workflow/**"
      - "tools/assurance-redis/**"
      - "tools/assurance-durable/**"
      - "tools/assurance-sdk/**"
      - "tests/unit/assuranceSdk/**"
      - "tools/assurance-lab/**"
      - "tests/unit/assuranceLab/**"
      - "docs/assurance/**"
      - "tools/openai-readiness/**"
      - "tests/unit/openaiReadiness/**"
      - "docs/openai/**"
      - "src/llmShield/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/openai-readiness.yml"
  pull_request:
    paths:
      - "tools/hf-containment/**"
      - "tools/hf-incident-sim/**"
      - "tools/safety-study/**"
      - "tools/openai-native/**"
      - "tools/openai-comparison/**"
      - "tools/local-meta-study/**"
      - "tools/local-meta-pilot/**"
      - "tools/assurance-isolation/**"
      - "tools/assurance-egress/**"
      - "tools/assurance-scope/**"
      - "tools/assurance-workflow/**"
      - "tools/assurance-redis/**"
      - "tools/assurance-durable/**"
      - "tools/assurance-sdk/**"
      - "tests/unit/assuranceSdk/**"
      - "tools/assurance-lab/**"
      - "tests/unit/assuranceLab/**"
      - "docs/assurance/**"
      - "tools/openai-readiness/**"
      - "tests/unit/openaiReadiness/**"
      - "docs/openai/**"
      - "src/llmShield/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/openai-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hf-containment-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay composed HF containment and local model proposals
        run: |
          python -m unittest discover -s tools/hf-containment/tests -v
          python tools/hf-containment/study.py verify --protocol docs/assurance/hf-containment/evidence/protocol.json docs/assurance/hf-containment/evidence/report.json
          python tools/hf-containment/model.py verify --protocol docs/assurance/hf-containment/evidence/protocol.json --capture docs/assurance/hf-containment/evidence/model-capture.json --report docs/assurance/hf-containment/evidence/model-report.json

  hf-incident-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay local Hugging Face incident simulation
        run: |
          python -m unittest discover -s tools/hf-incident-sim/tests -v
          python tools/hf-incident-sim/study.py verify --protocol docs/assurance/hf-incident/evidence/protocol.json docs/assurance/hf-incident/evidence/report.json

  safety-study-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SIMURGH_REDIS_SERVER: /tmp/safety-study-redis/redis-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay frozen synthetic safety study
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          bash tools/assurance-redis/install-redis.sh /tmp/safety-study-redis
          python -m unittest discover -s tools/safety-study/tests -v
          python tools/safety-study/boundary.py verify docs/assurance/safety-study/evidence/boundary-report.json
          python tools/safety-study/model_study.py verify docs/assurance/safety-study/evidence/luna-capture.json docs/assurance/safety-study/evidence/luna-report.json --runtime-python "$(command -v python)"
          python - <<'PYTHON'
          import json, pathlib, sys
          sys.path.insert(0, 'tools/safety-study')
          from model_study import fallback_required
          root = pathlib.Path('docs/assurance/safety-study/evidence')
          required = fallback_required(json.loads((root / 'luna-report.json').read_text()))
          assert (root / 'meta-capture.json').exists() == required, 'fallback capture inventory'
          assert (root / 'meta-report.json').exists() == required, 'fallback report inventory'
          PYTHON
          if test -f docs/assurance/safety-study/evidence/meta-capture.json; then
            python tools/safety-study/model_study.py verify docs/assurance/safety-study/evidence/meta-capture.json docs/assurance/safety-study/evidence/meta-report.json --runtime-python "$(command -v python)"
          fi

  luna-native-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SIMURGH_REDIS_SERVER: /tmp/luna-native-redis/redis-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay frozen Luna native function calls
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          bash tools/assurance-redis/install-redis.sh /tmp/luna-native-redis
          python -m unittest discover -s tools/openai-native/tests -v
          python tools/openai-native/native.py verify docs/assurance/openai-native/evidence/capture.json docs/assurance/openai-native/evidence/report.json --runtime-python "$(command -v python)"

  luna-comparison-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SIMURGH_REDIS_SERVER: /tmp/luna-comparison-redis/redis-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay frozen Luna workflow comparison
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          bash tools/assurance-redis/install-redis.sh /tmp/luna-comparison-redis
          python -m unittest discover -s tools/openai-comparison/tests -v
          python tools/openai-comparison/comparison.py verify docs/assurance/openai-comparison/evidence/capture.json docs/assurance/openai-comparison/evidence/report.json --runtime-python "$(command -v python)"

  meta-study-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: tools/assurance-workflow:tools/assurance-redis:tools/assurance-durable:tools/assurance-sdk:tools/assurance-isolation
      PYTHONDONTWRITEBYTECODE: "1"
      SIMURGH_REDIS_SERVER: /tmp/meta-study-redis/redis-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay frozen Meta workflow study
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          bash tools/assurance-redis/install-redis.sh /tmp/meta-study-redis
          # Frozen runtime's scrubbed child environment uses this absolute fallback.
          sudo install -D -m 755 /tmp/meta-study-redis/redis-server /workspace/.tools/redis-8.10.2/redis-server
          python -m unittest discover -s tools/local-meta-study/tests -v
          python tools/local-meta-study/replay.py verify docs/assurance/meta-study/evidence/capture.json docs/assurance/meta-study/evidence/report.json --runtime-python "$(command -v python)"

  local-meta-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Replay saved local Meta proposals without model downloads
        run: |
          python -m unittest discover -s tools/local-meta-pilot/tests -v
          python tools/local-meta-pilot/pilot.py verify docs/assurance/meta/evidence/capture.json docs/assurance/meta/evidence/report.json
          python tools/local-meta-pilot/pilot.py verify docs/assurance/meta/evidence/capture-compact.json docs/assurance/meta/evidence/report-compact.json

  descriptor-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: tools/assurance-isolation:tools/assurance-scope
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate descriptor isolation and selective connections
        run: |
          python -m unittest discover -s tools/assurance-isolation/tests -v
          python -m simurgh_isolation.study run --out /tmp/simurgh-isolation/report.json
          python -m simurgh_isolation.study verify /tmp/simurgh-isolation/report.json
          python -m simurgh_isolation.study verify docs/assurance/isolation/evidence/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: descriptor-isolation-report
          path: /tmp/simurgh-isolation/report.json
          if-no-files-found: error

  kernel-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: tools/assurance-egress:tools/assurance-scope
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate kernel egress around an approved service
        run: |
          python -m unittest discover -s tools/assurance-egress/tests -v
          python -m simurgh_egress.study run --out /tmp/simurgh-egress/report.json
          python -m simurgh_egress.study verify /tmp/simurgh-egress/report.json
          python -m simurgh_egress.study verify docs/assurance/egress/evidence/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-egress-report
          path: /tmp/simurgh-egress/report.json
          if-no-files-found: error

  incident-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: tools/assurance-scope
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate incident scope and durable stopping
        run: |
          python -m unittest discover -s tools/assurance-scope/tests -v
          python -m simurgh_scope.study run --out /tmp/simurgh-scope/report.json
          python -m simurgh_scope.study verify /tmp/simurgh-scope/report.json
          python -m simurgh_scope.study verify docs/assurance/scope/evidence/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: incident-scope-report
          path: /tmp/simurgh-scope/report.json
          if-no-files-found: error

  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:openai
      - run: npm run openai:offline -- --out /tmp/simurgh-openai/report.json
      - run: npm run openai:verify -- /tmp/simurgh-openai/report.json
      - name: Verify the saved reviewer artifact against this source tree
        run: npm run openai:verify -- docs/openai/results/offline-report.json
      - name: Run the real-effects assurance experiment
        run: |
          npm run test:assurance
          npm run assurance:run -- --out /tmp/simurgh-assurance/report.json
          npm run assurance:verify -- /tmp/simurgh-assurance/report.json
          npm run assurance:verify -- docs/assurance/evidence/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-evaluation-reports
          path: |
            /tmp/simurgh-openai/report.json
            /tmp/simurgh-assurance/report.json
          if-no-files-found: error

  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tools/assurance-redis:tools/assurance-durable:tools/assurance-sdk
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/assurance-sdk/requirements.lock
      - name: Validate pinned SDK approval and resume integrations
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock
          python -m pip check
          node --test tests/unit/assuranceSdk/*.test.js
          python -m unittest discover -s tools/assurance-sdk/tests -v
          python -m simurgh_sdk.study run --out /tmp/simurgh-sdk/report.json
          python -m simurgh_sdk.study verify /tmp/simurgh-sdk/report.json
          python -m simurgh_sdk.study verify docs/assurance/sdk/evidence/report.json
      - name: Validate durable effects across process crashes and retries
        run: |
          python -m unittest discover -s tools/assurance-durable/tests -v
          python -m simurgh_durable.study run --out /tmp/simurgh-durable/report.json
          python -m simurgh_durable.study verify /tmp/simurgh-durable/report.json
          python -m simurgh_durable.study verify docs/assurance/durable/evidence/report.json
      - name: Validate real Redis connector recovery and ambiguous responses
        env:
          SIMURGH_REDIS_SERVER: /tmp/simurgh-redis-bin/redis-server
        run: |
          bash tools/assurance-redis/install-redis.sh /tmp/simurgh-redis-bin
          python -m unittest discover -s tools/assurance-redis/tests -v
          python -m simurgh_redis.study run --out /tmp/simurgh-redis/report.json
          python -m simurgh_redis.study verify /tmp/simurgh-redis/report.json
          python -m simurgh_redis.study verify docs/assurance/redis/evidence/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-compatibility-report
          path: |
            /tmp/simurgh-sdk/report.json
            /tmp/simurgh-durable/report.json
            /tmp/simurgh-redis/report.json
          if-no-files-found: error

  workflow-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: tools/assurance-workflow:tools/assurance-redis:tools/assurance-durable:tools/assurance-sdk
      PYTHONDONTWRITEBYTECODE: "1"
      SIMURGH_REDIS_SERVER: /tmp/simurgh-workflow-redis/redis-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/assurance-sdk/requirements.lock
            tools/assurance-workflow/requirements.lock
      - name: Validate persisted native workflows across application restart
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/assurance-sdk/requirements.lock -r tools/assurance-workflow/requirements.lock
          python -m pip check
          bash tools/assurance-redis/install-redis.sh /tmp/simurgh-workflow-redis
          python -m unittest discover -s tools/assurance-workflow/tests -v
          python -m simurgh_workflow.study run --out /tmp/simurgh-workflow/report.json
          python -m simurgh_workflow.study verify /tmp/simurgh-workflow/report.json
          python -m simurgh_workflow.study verify docs/assurance/workflow/evidence/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: persisted-workflow-report
          path: /tmp/simurgh-workflow/report.json
          if-no-files-found: error
