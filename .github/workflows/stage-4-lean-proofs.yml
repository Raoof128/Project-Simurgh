name: stage-4-lean-proofs
# Q1-F001. This job used to name its proof files. The list drifted eleven behind the tree — every
# Stage 5R proof and Stage 5Q's own `Vsr.lean` were never type-checked, while each stage published
# "Lean theorems, zero sorry". The repair is the camera, not the photograph: the gate DISCOVERS its
# proofs, and adding filenames back here is a defect, not a fix. `tests/unit/leanProofGate.test.js`
# fails if any literal `.lean` path reappears in this file.
on:
  push:
    paths: ["proofs/**", "scripts/check-lean-proofs.mjs", "scripts/lib/leanProofGate.mjs"]
  pull_request:
    paths: ["proofs/**", "scripts/check-lean-proofs.mjs", "scripts/lib/leanProofGate.mjs"]
jobs:
  lean-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (pinned toolchain from proofs/stage4m/lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain "$(cat proofs/stage4m/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Type-check every Lean proof in the tree, and refuse every escape hatch
        run: node scripts/check-lean-proofs.mjs
