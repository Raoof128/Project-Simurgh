<!doctype html><meta charset="utf-8" />
<pre id="out"></pre>
<script type="module">
  import * as m from "./vpf-portable.mjs";
  const manifest = {
    schema: "simurgh.vpf.parity-manifest.v1",
    note: "Every function and vector that must agree across Node, Python and browser. K7 fails when an eligible export is missing here, when an entry has no implementation in some runtime, or when a deterministic export is silently excluded.",
    entry_count: 5,
    vector_count: 17,
    entries: [
      {
        id: "measurements.tenths",
        description: "integer round-half-up percentage, in tenths of a percent",
        vectors: [
          { input: { numerator: 1438, denominator: 23332 }, expected: 62 },
          { input: { numerator: 2118, denominator: 20213 }, expected: 105 },
          { input: { numerator: 1, denominator: 2 }, expected: 500 },
          { input: { numerator: 1, denominator: 3 }, expected: 333 },
          { input: { numerator: 2, denominator: 3 }, expected: 667 },
          { input: { numerator: 0, denominator: 23332 }, expected: 0 },
        ],
      },
      {
        id: "controls.spanDigest",
        description: "domain-separated digest of a control's source span",
        vectors: [
          {
            input: { source: "" },
            expected: "8a5e7dfa176aa0fc1193a246dd46abfebf57c4e1b9cced244c86755b9d7392e4",
          },
          {
            input: { source: "function v(){}" },
            expected: "0885b8fa61b446dfd19b9c7b89870e811f8d281ec0918ddb4a4910b795b58a12",
          },
          {
            input: { source: "функция ①②③ 🐦‍🔥" },
            expected: "c2cae08f4b2ab522a6132cf220fc675a8b57ee1f36957aa886c838964ea47b1e",
          },
        ],
      },
      {
        id: "inherit.filePin",
        description: "5R's pin over an inherited file's canonical bytes",
        vectors: [
          {
            input: { text: "a" },
            expected: "e1a5be630a3cbd27aa6c1e28db16998c7de9975cfc0d2e305ac15699977f031a",
          },
          {
            input: { text: "a\n" },
            expected: "e1a5be630a3cbd27aa6c1e28db16998c7de9975cfc0d2e305ac15699977f031a",
          },
          {
            input: { text: "a\r\nb" },
            expected: "095e85e94de233869a4fb8e45dbe50eb7f70df40067945f2598ad07bca27cb6f",
          },
          {
            input: { text: "a\nb" },
            expected: "095e85e94de233869a4fb8e45dbe50eb7f70df40067945f2598ad07bca27cb6f",
          },
        ],
      },
      {
        id: "laneB.verdictReceiptDigest",
        description: "the digest the child stamps its verdict with",
        vectors: [
          {
            input: {
              control_digest: "aa",
              detector_digest: "bb",
              declared_signal: "field-set differs",
              verdict: "detected",
              signal_evidence_digest: "cc",
            },
            expected: "8c61218f8443d8bb9c55cdb10e7aa6247c699a6a0cd2276cc4460729225aa303",
          },
          {
            input: {
              control_digest: "aa",
              detector_digest: "bb",
              declared_signal: "field-set differs",
              verdict: "not_detected",
              signal_evidence_digest: "cc",
            },
            expected: "5129097bebf6998f2b0c9306286efeb8738a2ed089f287a8eaaf4e60724ade2f",
          },
        ],
      },
      {
        id: "laneB.permute",
        description: "seeded control ordering, so sequence cannot leak the label",
        vectors: [
          {
            input: { items: ["c-01", "c-02", "c-03"], seed: "seed-alpha" },
            expected: "c-02,c-01,c-03",
          },
          {
            input: { items: ["c-01", "c-02", "c-03"], seed: "seed-beta" },
            expected: "c-03,c-02,c-01",
          },
        ],
      },
    ],
    out_of_scope: [
      {
        id: "writeSurface.checkChangeSet",
        reason: "reads git history; not a pure function of its inputs",
      },
      { id: "scratchTree.snapshotTree", reason: "reads the filesystem" },
      {
        id: "inherit.verifyInheritance",
        reason: "Ed25519 verification; crypto parity is a separate contract",
      },
      { id: "detectorChild", reason: "spawns a process; Lane B is a Node-side ceremony" },
    ],
  };
  const out = () => document.getElementById("out");
  m.answerManifest(manifest)
    .then((a) => {
      out().textContent = "5R-PARITY-BEGIN" + JSON.stringify(a) + "5R-PARITY-END";
    })
    .catch((e) => {
      out().textContent = "5R-PARITY-ERROR " + e.message;
    });
</script>
